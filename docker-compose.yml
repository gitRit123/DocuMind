version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/documind
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/faiss_indexes:/app/faiss_indexes

  streamlit_app:
    build: ./streamlit_app
    ports:
      - "8501:8501"
    environment:
      DOCUMIND_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
